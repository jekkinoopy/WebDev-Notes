<!doctype html>
<html lang="zh-TW">

<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../crayon-layout.css">
    <link rel="stylesheet" href="./records.css">
</head>

<body class="crayon-school records-page">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">野原家健康任務管理</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">任務列表</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="create.html">新增任務</a>

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">回到首頁</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">

            <a href="create.html" class="btn btn-success">＋ 新增任務</a>

        <table class="table table-striped table-bordered table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th scope="col">編號</th>
                    <th scope="col">成員</th>
                    <th scope="col">分類</th>
                    <th scope="col">健康任務</th>
                    <th scope="col">狀態</th>
                    <th scope="col">操作</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">1</th>
                    <td>美冴</td>
                    <td>飲食管理</td>
                    <td>巧克力餅乾配額監控</td>
                    <td><span class="badge text-bg-success">進行中</span></td>
                    <td>
                        <a href="edit.html" class="btn btn-sm btn-warning me-1">修改</a>
                        <a href="delete.html" class="btn btn-sm btn-danger">刪除</a>
                    </td>
                </tr>
                <tr>
                    <th scope="row">2</th>
                    <td>廣志</td>
                    <td>運動特訓</td>
                    <td>居酒屋後夜跑 30 分鐘</td>
                    <td><span class="badge text-bg-warning text-dark">待處理</span></td>
                    <td>
                        <a href="edit.html" class="btn btn-sm btn-warning me-1">修改</a>
                        <a href="delete.html" class="btn btn-sm btn-danger">刪除</a>
                    </td>
                </tr>
                <tr>
                    <th scope="row">3</th>
                    <td>小新</td>
                    <td>飲食管理</td>
                    <td>青椒攝取任務</td>
                    <td><span class="badge text-bg-primary">已完成</span></td>
                    <td>
                        <a href="edit.html" class="btn btn-sm btn-warning me-1">修改</a>
                        <a href="delete.html" class="btn btn-sm btn-danger">刪除</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
