<!doctype html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>野原家健康任務管理・新增任務</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../crayon-layout.css">
    <link rel="stylesheet" href="./records.css">
</head>

<body class="crayon-school records-page">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">野原家健康任務管理</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">任務列表</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="create.html">新增任務</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">回到首頁</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h1 class="mb-4">新增健康任務</h1>

        <form action="store.html" method="get" class="col-lg-6">
            <div class="mb-3">
                <label for="member" class="form-label">成員</label>
                <select class="form-select" id="member" name="member" required>
                    <option value="" selected disabled>請選擇成員</option>
                    <option value="美冴">美冴</option>
                    <option value="廣志">廣志</option>
                    <option value="小新">小新</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="category" class="form-label">分類</label>
                <select class="form-select" id="category" name="category" required>
                    <option value="" selected disabled>請選擇分類</option>
                    <option value="飲食管理">飲食管理</option>
                    <option value="運動特訓">運動特訓</option>
                    <option value="生活習慣">生活習慣</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="task" class="form-label">健康任務</label>
                <input type="text" class="form-control" id="task" name="task" placeholder="請輸入健康任務內容" required>
            </div>
            <div class="mb-3">
                <label for="status" class="form-label">狀態</label>
                <select class="form-select" id="status" name="status" required>
                    <option value="待處理">待處理</option>
                    <option value="進行中">進行中</option>
                    <option value="已完成">已完成</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">送出新增</button>
            <a href="index.html" class="btn btn-secondary">取消</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
